<div class='craft-resource-wrapper'>
  <app-icon [itemName]="craftResource.uniquename"/>
  <app-label [label]="'×' + craftResource.count"/>
  <app-price-display
    [prices]="resourcePrices"
    [displayType]="PriceType.SellMin"
    [selectedPriceSignal]="selectedResourcePrice"
    [inTwoRows]="true"
    [eventToObserve]="GlobalEventType.RESOURCES_CITY_CHANGED"
  />
</div>
